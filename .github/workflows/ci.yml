# CI for gpu-inference-server.
#
# This repository runs CI LOCALLY on the Owner's self-hosted Windows 11 runner.
# Every job must stay on the self-hosted runner; no GitHub-hosted runners.
# The repository is public, so only trusted triggers are allowed: pushing to
# the default branch and manual dispatch. Pull requests from forks must never
# execute code on the local machine.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  python:
    name: Python 3.10 install and static checks
    runs-on: [self-hosted, Windows, X64, gpu-inference-server]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip and build tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Byte-compile Python sources
        run: python -m compileall -q src scripts setup.py

      # Local metadata build only: no index, no dependency resolution, so the
      # check stays deterministic and offline.
      - name: Validate packaging metadata
        run: python -m pip install --dry-run --no-deps --no-build-isolation --no-index .

  docker:
    name: Docker compose config and image build
    runs-on: [self-hosted, Windows, X64, gpu-inference-server]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose --file docker/docker-compose.yml --env-file .env.example config --quiet

      # The image installs CUDA PyTorch and is large, so it is only built on
      # manual dispatch instead of on every push to the default branch.
      - name: Build image
        if: github.event_name == 'workflow_dispatch'
        run: docker build --file docker/Dockerfile --tag gpu-inference-server:ci .
