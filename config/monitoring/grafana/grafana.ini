# Location: E:/justica/config/monitoring/grafana/grafana.ini

[server]
protocol = http
http_port = 3000

[security]
# Admin credentials are supplied by docker/docker-compose.yml through the
# GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD environment variables
# (see .env.example). Never commit real credentials here.

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/ai_server.json